<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1c"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.6" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="30" y="30" width="964" height="964" rx="200" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.5"/>

  <g filter="url(#glow)">
    <circle cx="512" cy="512" r="330" fill="none" stroke="url(#ring)" stroke-width="26" opacity="0.92"/>
    <circle cx="512" cy="512" r="245" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.45"/>
  </g>

  <!-- waveform bars -->
  <g filter="url(#glow)">
    <rect x="330" y="432" width="46" height="160" rx="23" fill="url(#bar)"/>
    <rect x="412" y="340" width="46" height="344" rx="23" fill="url(#bar)"/>
    <rect x="494" y="268" width="46" height="488" rx="23" fill="url(#bar)"/>
    <rect x="576" y="352" width="46" height="320" rx="23" fill="url(#bar)"/>
    <rect x="658" y="452" width="46" height="120" rx="23" fill="url(#bar)" opacity="0.85"/>
  </g>
</svg>
