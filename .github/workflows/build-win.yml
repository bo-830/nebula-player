name: build-win

# 云端构建 Windows 安装包并（打 tag 时）自动发布到 GitHub Release。
#
# 为什么这么做：本地只 push 源码（仓库 ~11MB），118MB 的安装包由 GitHub 的
# runner 构建并上传 —— 从根上避开"本机上传大文件容易中断"。
#
# 触发方式：
#   - 手动：Actions → build-win → Run workflow
#   - 打标签：git tag v1.0.6 && git push origin v1.0.6   ⇒ 自动建 Release 并附产物
#   - 推 main：只构建并上传 artifact（不建 Release）

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-win-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (判据：0 error)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build installer (build:win)
        run: npm run build:win

      - name: Verify packaged asar hygiene
        run: node scripts/verify-asar.mjs

      # 只发布"本次版本"的产物：显式按 package.json 的版本号拼路径，
      # 避免 dist/ 里有历史版本时被一并上传。
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "v=$v" >> $env:GITHUB_OUTPUT
          Write-Output "building version $v"

      - name: Show artifacts
        shell: pwsh
        run: |
          Get-ChildItem dist -File |
            Where-Object { $_.Name -match 'setup\.exe$|\.blockmap$|^latest\.yml$' } |
            Sort-Object Name |
            ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.Name }
          '--- latest.yml ---'
          Get-Content dist/latest.yml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-player-${{ steps.ver.outputs.v }}-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/nebula-player-${{ steps.ver.outputs.v }}-setup.exe
            dist/nebula-player-${{ steps.ver.outputs.v }}-setup.exe.blockmap
            dist/latest.yml

      # 只有打 tag（v*）时才建 Release；latest.yml 一并上传，
      # 应用内 electron-updater 的 generic feed 才能工作（updateURL 指向该 feed）。
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nebula-player-${{ steps.ver.outputs.v }}-setup.exe
            dist/nebula-player-${{ steps.ver.outputs.v }}-setup.exe.blockmap
            dist/latest.yml
          generate_release_notes: true
